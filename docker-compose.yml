name: gasflow

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: gasflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gasflow}
      GASFLOW_APP_PASSWORD: ${GASFLOW_APP_PASSWORD:?GASFLOW_APP_PASSWORD is required}
      GASFLOW_OWNER_PASSWORD: ${GASFLOW_OWNER_PASSWORD:?GASFLOW_OWNER_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - gasflow_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-gasflow}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  gasflow_pgdata: